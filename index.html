<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --water:#BFE0E3;
    --water-dk:#8FBFC4;
    --sand:#F1E9D8;
    --ink:#3B463F;
    --paper:#FAF7F0;
    --card:#FFFFFF;
    --muted:#8A9490;
    --line:#E9E2D2;
    --shadow:0 4px 16px rgba(143,191,196,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(160deg,#E4F1F1 0%, #F3ECDD 55%, #F1E9D8 100%);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app-shell{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.10);
    display:flex;
    flex-direction:column;
  }
  /* ---------- HERO ---------- */
  .hero{
    background:linear-gradient(120deg, #DCEEEF 0%, #EDF3E9 60%, #F3ECDC 100%);
    color:#3B463F;
    padding:30px 22px 24px;
    position:relative;
    overflow:hidden;
  }
  .hero-title{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:38px;
    margin:0 0 2px;
    letter-spacing:1px;
    position:relative;
    color:#4A5A52;
    line-height:1.15;
  }
  .hero-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:4px;
    font-size:20px;
    margin:0 0 10px;
    display:flex;
  }
  .wave-letter{
    display:inline-block;
    animation:waveBounce 1.8s ease-in-out infinite;
  }
  @keyframes waveBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  .venue-badge{
    display:inline-block;
    font-size:12.5px;
    color:#4A5A52;
    background:linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.55));
    border:1px solid rgba(255,255,255,0.9);
    border-radius:20px;
    padding:6px 16px;
    margin-top:2px;
    position:relative;
    box-shadow: 0 3px 6px rgba(143,191,196,0.35), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 3px rgba(143,191,196,0.25);
  }
  .hero-sub{
    font-size:12.5px;
    color:#6E7C74;
    margin:0;
    position:relative;
  }
  .hero-text{
    position:relative;
    padding-right:78px;
  }
  .hero-badge{
    position:absolute;
    top:20px; right:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    perspective:500px;
  }
  .badge-circle{
    width:62px;height:62px;
    border-radius:50%;
    background:rgba(255,255,255,0.68);
    border:2px solid rgba(255,255,255,0.9);
    box-shadow:0 4px 9px rgba(143,191,196,0.32);
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(2px);
  }
  .badge-circle .num{
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    font-weight:800;
    display:block;
    color:#4A5A52;
    line-height:1.05;
    text-align:center;
  }
  .badge-circle .lbl{
    font-size:8px;
    color:#7C8B83;
    margin-top:1px;
    display:block;
    text-align:center;
  }
  .flip-card-inner{
    transform-origin:top center;
    animation:flipReveal 0.9s ease-out;
  }
  @keyframes flipReveal{
    0%{ transform:rotateX(-95deg); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:rotateX(0deg); opacity:1; }
  }
  /* ---------- TAB CONTENT ---------- */
  .content{
    flex:1;
    padding:18px 16px 100px;
  }
  .panel{display:none;}
  .panel.active{display:block;}
  /* ---------- CARD (ticket) ---------- */
  .ticket{
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    padding:10px 14px;
    margin-bottom:8px;
  }
  .ticket-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .ticket-name{font-weight:700;font-size:14.5px;color:var(--ink);}
  .ticket-dates{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .status-pill{
    font-size:11px;
    padding:3px 10px;
    border-radius:20px;
    white-space:nowrap;
    font-weight:500;
  }
  .status-0{background:#EEF2EF;color:var(--muted);}
  .status-1{background:#F5E9D2;color:#A57C2E;}
  .status-2{background:#DCE9EA;color:#3E767C;}
  .status-3{background:var(--water-dk);color:#fff;}
  .check-pop{
    display:inline-block;
    opacity:0;
    transform:scale(0);
  }
  .check-pop.play{
    animation:checkPop 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes checkPop{
    0%{ transform:scale(0); opacity:0; }
    60%{ transform:scale(1.35); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  .progress-track{height:7px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--water-dk),var(--sand));border-radius:6px;}
  .ticket-meta{font-size:11.5px;color:var(--muted);margin-top:8px;}
  .task-group-title{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--water-dk);
    margin:22px 0 10px;
    padding-left:2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .task-group-title:first-child{margin-top:0;}
  .task-group-title .tag{
    font-family:'Noto Sans TC',sans-serif;
    font-weight:500;
    font-size:11px;
    color:var(--muted);
  }
  /* ---------- overall progress ---------- */
  .overall-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .overall-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .overall-top .big{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:800;color:var(--water-dk);}
  .overall-top .cap{font-size:12px;color:var(--muted);}
  .category-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .category-mini{background:#F1FAF9;border-radius:10px;padding:7px 4px;text-align:center;}
  .category-mini .pct{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;color:var(--water-dk);display:block;}
  .category-mini .lbl{font-size:9.5px;color:var(--muted);margin-top:1px;display:block;}
  /* ---------- expenses ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;}
  .stat-card .v{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:700;color:var(--water-dk);display:block;}
  .stat-card .l{font-size:11px;color:var(--muted);margin-top:2px;display:block;}
  .chart-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 16px 16px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .gauge{
    width:220px;
    height:112px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .gauge-arc{
    position:absolute;
    top:0; left:0;
    width:220px; height:220px;
    border-radius:50%;
  }
  .gauge-hole{
    position:absolute;
    top:26px; left:26px;
    width:168px; height:168px;
    border-radius:50%;
    background:var(--card);
    box-shadow:inset 0 2px 6px rgba(74,90,82,0.08);
  }
  .gauge-center{
    position:absolute;
    bottom:2px; left:0; right:0;
    text-align:center;
  }
  .gauge-center .v{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;color:var(--water-dk);display:block;line-height:1.1;}
  .gauge-center .l{font-size:10px;color:var(--muted);letter-spacing:1px;}
  .legend{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 12px;
  }
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink);}
  .legend-swatch{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .legend-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend-pct{color:var(--muted);font-weight:600;font-size:10.5px;}
  .payer-chips{display:flex;gap:6px;margin-bottom:16px;}
  .payer-chip{flex:1;border-radius:12px;padding:7px 4px;text-align:center;min-width:0;}
  .payer-chip .pname{font-size:10px;font-weight:700;display:block;letter-spacing:0.5px;}
  .payer-chip .pamount{font-size:11.5px;font-weight:700;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip-YUN{background:#FFE3EC;color:#B3325F;}
  .chip-WEI{background:#DCEBFB;color:#1F5FA6;}
  .chip-BOSS{background:#E6F4D9;color:#4F7A24;}
  .chip-AMY{background:#F3E4FB;color:#7A3EA6;}
  .expense-group{margin-bottom:16px;}
  .expense-group-title{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--water-dk);
    margin:0 0 8px 2px;
  }
  .expense-rows{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .expense-row{padding:10px 14px;border-bottom:1px solid var(--line);}
  .expense-row:last-child{border-bottom:none;}
  .expense-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .expense-row-top .name{font-weight:600;font-size:13px;}
  .expense-row-top .total{font-weight:700;font-size:13px;color:var(--water-dk);white-space:nowrap;}
  .expense-row-detail{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .expense-row-detail .payer-badge{font-size:10px;padding:2px 7px;}
  .expense-row-detail .paid-tag{font-size:10px;padding:1px 6px;border-radius:8px;}
  .payer-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;}
  .payer-YUN{background:#FFE3EC;color:#B3325F;}
  .payer-WEI{background:#DCEBFB;color:#1F5FA6;}
  .payer-BOSS{background:#E6F4D9;color:#4F7A24;}
  .payer-AMY{background:#F3E4FB;color:#7A3EA6;}
  .payer-TBD{background:#EEF2EF;color:#8A9490;}
  .money-line{font-size:12px;color:var(--muted);margin-top:6px;}
  .money-line b{color:var(--ink);}
  .paid-tag{font-size:10.5px;padding:2px 7px;border-radius:10px;margin-left:6px;}
  .paid-yes{background:#DCE9EA;color:#3E767C;}
  .paid-no{background:#F5E9D2;color:#A57C2E;}
  /* ---------- vendors ---------- */
  .vendor-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .vendor-cat{display:inline-block;font-size:11px;color:#3E5A52;background:linear-gradient(90deg,var(--water),#EAF3EC);font-weight:700;letter-spacing:0.5px;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
  .vendor-name{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;margin:4px 0 8px;}
  .vendor-list{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink);line-height:1.8;}
  .vendor-list li{margin-bottom:2px;}
  .vendor-ig{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:#fff;text-decoration:none;font-weight:600;background:linear-gradient(90deg,#8A6FD8,#D06B9C);padding:6px 14px;border-radius:20px;}
  .empty-hint{font-size:12px;color:var(--muted);padding:10px 4px 4px;}
  /* ---------- schedule ---------- */
  .schedule-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .schedule-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  .schedule-period{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:22px;color:var(--water-dk);}
  .schedule-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;color:var(--ink);}
  .schedule-items{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.9;}
  .schedule-items li{margin-bottom:2px;}
  /* ---------- bottom tabs ---------- */
  .tabbar{position:sticky;bottom:0;left:0;right:0;display:flex;background:#FFFFFF;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));margin-top:auto;}
  .tabbtn{flex:1;background:none;border:none;color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:11px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .tabbtn .mark{
    width:auto;height:auto;
    border:none;
    line-height:1;
    font-size:22px;
    color:#D8CDBB;
  }
  .tabbtn .mark::before{
    content:"♥";
  }
  .tabbtn.active{color:var(--water-dk);font-weight:700;}
  .tabbtn.active .mark{color:var(--water-dk);border-color:transparent;background:none;}
</style>
</head>
<body>
<div class="app-shell">

  <div class="hero">
    <div class="hero-text">
      <h1 class="hero-title">Wei &amp; Yun</h1>
      <p class="hero-label" id="waveLabel"></p>
      <div class="venue-badge">苗栗 · 尚順君樂飯店 星輝廳</div>
    </div>
    <div class="hero-badge">
      <div class="badge-circle">
        <div class="flip-card-inner">
          <span class="num" id="countdownNum">—</span>
          <span class="lbl">倒數天</span>
        </div>
      </div>
      <div class="badge-circle">
        <div class="flip-card-inner" style="animation-delay:0.15s;">
          <span class="num" id="progressPct">—</span>
          <span class="lbl">進度</span>
        </div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="panel active" id="panel-progress">
      <div class="overall-box">
        <div class="overall-top">
          <span class="big" id="overallBig">0%</span>
          <span class="cap" id="overallCap">0 / 0 項已完成</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="overallFill" style="width:0%"></div></div>
        <div class="category-mini-grid" id="categoryMiniGrid"></div>
      </div>
      <div id="taskList"></div>
    </div>

    <div class="panel" id="panel-expense">
      <div class="stat-grid">
        <div class="stat-card"><span class="v" id="expTotal">-</span><span class="l">總支出估算</span></div>
        <div class="stat-card"><span class="v" id="expPaid">-</span><span class="l">已付金額</span></div>
      </div>
      <div class="payer-chips" id="payerStatGrid"></div>
      <div class="chart-card">
        <div class="gauge">
          <div class="gauge-arc" id="gaugeArc"></div>
          <div class="gauge-hole"></div>
          <div class="gauge-center"><span class="v" id="gaugeTotal">-</span><span class="l">總支出</span></div>
        </div>
        <div class="legend" id="donutLegend"></div>
      </div>
      <div id="expenseList" style="margin-top:6px;"></div>
    </div>

    <div class="panel" id="panel-vendor">
      <div id="vendorList" style="margin-top:6px;"></div>
    </div>

    <div class="panel" id="panel-schedule">
      <div id="scheduleRoot"></div>
    </div>

  </div>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="progress"><span class="mark"></span>進度</button>
    <button class="tabbtn" data-tab="expense"><span class="mark"></span>支出</button>
    <button class="tabbtn" data-tab="vendor"><span class="mark"></span>廠商</button>
    <button class="tabbtn" data-tab="schedule"><span class="mark"></span>流程</button>
  </div>
</div>

<script>

const EXPENSES = [
  {group:'婚宴', name:'場地', deposit:46000, depositPayer:'BOSS', depositPaid:true, final:0, finalPayer:'TBD', finalPaid:false},
  {group:'婚宴', name:'新秘', deposit:8000, depositPayer:'YUN', depositPaid:true, final:18000, finalPayer:'TBD', finalPaid:false},

  {group:'婚宴', name:'婚錄', deposit:10200, depositPayer:'YUN', depositPaid:true, final:23800, finalPayer:'TBD', finalPaid:false},
  {group:'婚宴', name:'婚顧＋主持＋樂團＋助理', deposit:20400, depositPayer:'WEI', depositPaid:true, final:47600, finalPayer:'TBD', finalPaid:false},

function renderWaveLabel(){
  const text = 'WEDDING 💍';
  const colors = ['#4FADA3','#5BB3B9','#6FC0C5','#87CDD1','#A0D9DC','#B9E4E6','#CDEDEF'];
  const el = document.getElementById('waveLabel');
  el.innerHTML = '';
  let letterIndex = 0;
  [...text].forEach(ch=>{
    const span = document.createElement('span');
    if(ch === ' '){
      span.style.display='inline-block';
      span.style.width='6px';
      span.textContent='';
    }else{
      span.className = 'wave-letter';
      span.textContent = ch;
      if(ch !== '💍'){
        span.style.color = colors[letterIndex % colors.length];
        span.style.animationDelay = (letterIndex*0.09)+'s';
        letterIndex++;
      }else{
        span.style.animationDelay = (letterIndex*0.09)+'s';
      }
    }
    el.appendChild(span);
  });
}

function fmt(n){ return Math.round(n||0).toLocaleString('zh-TW'); }

function animateCount(el, endVal, duration=1000, suffix=''){
  if(!el) return;
  const start = performance.now();
  function tick(now){
    const progress = Math.min((now-start)/duration, 1);
    const eased = 1 - Math.pow(1-progress, 3);
    const val = Math.round(endVal*eased);
    el.textContent = val + suffix;
    if(progress<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function animateWidth(el, endPercent, duration=1000){
  if(!el) return;
  const start = performance.now();
  function tick(now){
    const progress = Math.min((now-start)/duration, 1);
    const eased = 1 - Math.pow(1-progress, 3);
    const val = endPercent*eased;
    el.style.width = val + '%';
    if(progress<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function updateCountdown(){
  const now = new Date();
  const diff = Math.ceil((WEDDING_DATE - now)/(1000*60*60*24));
  animateCount(document.getElementById('countdownNum'), diff > 0 ? diff : 0, 3000);
}

function taskSortValue(t){
  if(t.actual){
    const parts = t.actual.split('/').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]).getTime();
  }
  const m = t.start.match(/(\d+)年(\d+)月/);
  if(m){
    return new Date(parseInt(m[1]), parseInt(m[2])-1, 1).getTime();
  }
  return 0;
}

function renderTasks(){
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  let sum = 0;
  let checkCounter = 0;
  const groups = ['登記','婚宴','蜜月'];
  const miniStats = [];

  groups.forEach(g=>{
    const all = TASKS.filter(t=>t.group===g);
    if(!all.length) return;
    const pending = all.filter(t=>t.status<3).slice().sort((a,b)=>taskSortValue(a)-taskSortValue(b));
    const done = all.filter(t=>t.status===3).slice().sort((a,b)=>taskSortValue(a)-taskSortValue(b));
    const items = pending.concat(done);

    const groupSum = all.reduce((s,t)=>s+WEIGHTS[t.status],0);
    const groupPct = Math.round(groupSum/all.length);
    miniStats.push({label:g, pct:groupPct});

    const doneInGroup = done.length;
    const header = document.createElement('div');
    header.className = 'task-group-title';
    header.innerHTML = `${g} <span class="tag">${doneInGroup}/${all.length}</span>`;
    list.appendChild(header);

    items.forEach(t=>{
      sum += WEIGHTS[t.status];
      const div = document.createElement('div');
      div.className = 'ticket';
      const dateLine = (t.status===3 || !t.start) ? '' : `<div class="ticket-dates">預計 ${t.start} － ${t.end}</div>`;
      let checkMark = '';
      if(t.status===3){
        checkMark = `<span class="check-pop" style="animation-delay:${Math.min(checkCounter*70,600)}ms">✓</span> `;
        checkCounter++;
      }
      div.innerHTML = `
        <div class="ticket-row">
          <div>
            <div class="ticket-name">${t.name}</div>
            ${dateLine}
            ${t.actual?`<div class="ticket-meta">實際完成日：${t.actual}</div>`:''}
            ${t.note?`<div class="ticket-meta">${t.note}</div>`:''}
          </div>
          <span class="status-pill status-${t.status}">${checkMark}${STATUS_LABEL[t.status]}</span>
        </div>
      `;
      list.appendChild(div);
    });
  });

  const overallPct = TASKS.length ? Math.round(sum/TASKS.length) : 0;
  animateCount(document.getElementById('overallBig'), overallPct, 3000, '%');
  animateWidth(document.getElementById('overallFill'), overallPct, 3000);
  const doneCount = TASKS.filter(t=>t.status===3).length;
  document.getElementById('overallCap').textContent = `${doneCount} / ${TASKS.length} 項已完成`;
  animateCount(document.getElementById('progressPct'), overallPct, 3000, '%');

  document.getElementById('categoryMiniGrid').innerHTML = miniStats.map(m=>
    `<div class="category-mini"><span class="pct">${m.pct}%</span><span class="lbl">${m.label}</span></div>`
  ).join('');
}

const CHART_COLORS = ['#4FADA3','#8FBFC4','#C9A15C','#D9A5B3','#9BBF8C','#7A93C9','#C48B9F','#B98D8D','#8AA6A3','#E4B7A0','#A3C9A8','#C9B6A5'];

function renderExpenses(){
  const list = document.getElementById('expenseList');
  list.innerHTML = '';
  let total=0, paid=0;
  const payers = ['YUN','WEI','BOSS','AMY'];
  const byPayer = {}; payers.forEach(p=>byPayer[p]=0);
  const groups = ['登記','婚宴','蜜月'];

  const badge = (p)=> p==='TBD' ? `<span class="payer-badge payer-TBD">待定</span>` : `<span class="payer-badge payer-${p}">${p}</span>`;

  groups.forEach(g=>{
    const items = EXPENSES.filter(ex=>ex.group===g);
    if(!items.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'expense-group';
    const rowsHtml = items.map(ex=>{
      const t = (ex.deposit||0)+(ex.final||0);
      total += t;
      if(ex.depositPaid) paid += (ex.deposit||0);
      if(ex.finalPaid) paid += (ex.final||0);
      if(byPayer[ex.depositPayer]!==undefined) byPayer[ex.depositPayer]+=(ex.deposit||0);
      if(byPayer[ex.finalPayer]!==undefined) byPayer[ex.finalPayer]+=(ex.final||0);

      const noLabel = (ex.name==='客製化書約' || ex.name==='音響');
      let detail = '';
      if(ex.deposit>0){
        detail += `<span>${noLabel?'':'訂金 '}NT$${fmt(ex.deposit)}</span>${badge(ex.depositPayer)}<span class="paid-tag ${ex.depositPaid?'paid-yes':'paid-no'}">${ex.depositPaid?'已付':'未付'}</span>`;
      }
      if(ex.final>0){
        detail += `<span>${noLabel?'':'尾款 '}NT$${fmt(ex.final)}</span>${badge(ex.finalPayer)}<span class="paid-tag ${ex.finalPaid?'paid-yes':'paid-no'}">${ex.finalPaid?'已付':'婚禮當天'}</span>`;
      }
      if(ex.deposit===0 && ex.final===0){
        detail = `<span>尚未提供金額</span>`;
      }
      return `
        <div class="expense-row">
          <div class="expense-row-top"><span class="name">${ex.name}</span><span class="total">NT$${fmt(t)}</span></div>
          <div class="expense-row-detail">${detail}</div>
        </div>
      `;
    }).join('');
    wrap.innerHTML = `<div class="expense-group-title">${g}</div><div class="expense-rows">${rowsHtml}</div>`;
    list.appendChild(wrap);
  });

  document.getElementById('expTotal').textContent = 'NT$'+fmt(total);
  document.getElementById('expPaid').textContent = 'NT$'+fmt(paid);
  document.getElementById('payerStatGrid').innerHTML = payers.map(p=>`<div class="payer-chip chip-${p}"><span class="pname">${p}</span><span class="pamount">${fmt(byPayer[p])}</span></div>`).join('');

  renderExpenseChart(total);
}

function renderExpenseChart(total){
  const arc = document.getElementById('gaugeArc');
  const legend = document.getElementById('donutLegend');
  document.getElementById('gaugeTotal').textContent = 'NT$'+fmt(total);

  const priced = EXPENSES
    .map(ex=>({name:ex.name, amount:(ex.deposit||0)+(ex.final||0)}))
    .filter(x=>x.amount>0)
    .sort((a,b)=>b.amount-a.amount);

  if(!priced.length || total<=0){
    arc.style.background = 'var(--line)';
    legend.innerHTML = '<div class="empty-hint">尚無已填金額的項目可供分析</div>';
    return;
  }

  let acc = 0;
  const stops = priced.map((item,i)=>{
    const start = (acc/total)*180;
    acc += item.amount;
    const end = (acc/total)*180;
    const color = CHART_COLORS[i % CHART_COLORS.length];
    return `${color} ${start}deg ${end}deg`;
  });
  arc.style.background = `conic-gradient(from -90deg, ${stops.join(',')})`;

  legend.innerHTML = priced.map((item,i)=>{
    const pct = ((item.amount/total)*100).toFixed(1);
    const color = CHART_COLORS[i % CHART_COLORS.length];
    return `<div class="legend-item"><span class="legend-swatch" style="background:${color}"></span><span class="legend-name">${item.name}</span><span class="legend-pct">${pct}%</span></div>`;
  }).join('');
}

function initCheckPopObserver(){
  const marks = document.querySelectorAll('.check-pop');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('play');
        obs.unobserve(entry.target);
      }
    });
  }, {threshold:0.6});
  marks.forEach(m=>obs.observe(m));
}
